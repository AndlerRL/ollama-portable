version: "3"

dotenv: [".env"]
silent: true

tasks:
  boot:
    desc: Start ollama_server and pull a model
    cmds:
      - bash scripts/init.sh {{.CLI_ARGS}}
      - |
        if [ -f ollama_backup_pre-down.tar.gz ]; then
          echo "Found pre-down backup. Restoring..."
          bash scripts/restore.sh ollama_backup_pre-down.tar.gz
        fi
      - task webui

  reboot:
    desc: Tear down and boot fresh (preserves data)
    cmds:
      - bash scripts/backup.sh --tag pre-reboot
      - task down
      - task boot
      - |
        if [ -f ollama_backup_pre-reboot.tar.gz ]; then
          echo "Restoring data from pre-reboot backup..."
          bash scripts/restore.sh ollama_backup_pre-reboot.tar.gz
        fi

  up:
    desc: Start all services (ollama_server + optional webui)
    cmds:
      - bash scripts/compose.sh up -d

  webui:
    desc: Start ollama_server with Open WebUI
    cmds:
      - bash scripts/compose.sh --profile webui up -d

  native:
    desc: Apple Silicon hybrid — native Ollama (Metal) + containerized Open WebUI
    cmds:
      - |
        if ! command -v ollama >/dev/null 2>&1; then
          echo "Native Ollama not found. Install it first:"
          echo "  brew install ollama"
          echo "  # or: curl -fsSL https://ollama.com/install.sh | sh"
          exit 1
        fi
        if ! curl -sf http://localhost:11434/api/version >/dev/null 2>&1; then
          echo "Starting native Ollama (Metal)..."
          ollama serve > /tmp/ollama-native.log 2>&1 &
          echo $! > /tmp/ollama-native.pid
          echo "Waiting for native Ollama to come up..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/version >/dev/null 2>&1; then
              echo "Native Ollama is up on http://localhost:11434"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:11434/api/version >/dev/null 2>&1; then
            echo "Native Ollama did not start. Check /tmp/ollama-native.log"
            exit 1
          fi
        else
          echo "Native Ollama already running on http://localhost:11434"
        fi
        # Verify reachability from Docker host path
        if ! curl -sf http://host.docker.internal:11434/api/version >/dev/null 2>&1; then
          echo "Warning: Ollama not reachable via host.docker.internal:11434."
          echo "Open WebUI may not connect. Check Docker Desktop DNS settings."
        fi
        echo "Starting Open WebUI (points at host.docker.internal:11434)..."
        docker compose -f docker-compose.yml -f docker-compose.apple.yml --profile webui up -d
        echo ""
        echo "Open WebUI: http://localhost:{{.WEBUI_HOST_PORT | default 3000}}"
        echo "Native Ollama: http://localhost:11434 (Metal-accelerated)"
        echo "Native Ollama logs: /tmp/ollama-native.log"
        echo "Native Ollama PID: $(cat /tmp/ollama-native.pid 2>/dev/null || echo 'unknown')"

  native-stop:
    desc: Stop the native Ollama background process (Apple Silicon)
    cmds:
      - |
        if [ -f /tmp/ollama-native.pid ]; then
          PID=$(cat /tmp/ollama-native.pid)
          echo "Stopping native Ollama (PID $PID)..."
          kill "$PID" 2>/dev/null || echo "Process already stopped."
          rm -f /tmp/ollama-native.pid
        else
          echo "No native Ollama PID file found. Try: pkill ollama"
        fi

  down:
    desc: Tear down everything (auto-backups before removing volumes)
    cmds:
      - bash scripts/backup.sh --tag pre-down
      - bash scripts/compose.sh --profile webui down -v --remove-orphans

  stop:
    desc: Stop all services (keeps volumes)
    cmds:
      - bash scripts/compose.sh --profile webui stop

  reload:
    desc: Tear down and restart all services (preserves data)
    cmds:
      - bash scripts/backup.sh --tag pre-reload
      - task down
      - sleep 5
      - bash scripts/compose.sh --profile webui up -d
      - |
        if [ -f ollama_backup_pre-reload.tar.gz ]; then
          echo "Restoring data from pre-reload backup..."
          bash scripts/restore.sh ollama_backup_pre-reload.tar.gz
        fi

  pull:
    desc: Pull a model into the running container
    cmds:
      - bash scripts/pull.sh {{.CLI_ARGS}}

  list:
    desc: List all pulled models
    cmds:
      - bash scripts/list.sh

  rm:
    desc: Remove a model
    cmds:
      - bash scripts/rm.sh {{.CLI_ARGS}}

  run:
    desc: Start interactive chat with a model
    cmds:
      - bash scripts/run.sh {{.CLI_ARGS}}

  show:
    desc: Show model details
    cmds:
      - bash scripts/show.sh {{.CLI_ARGS}}

  status:
    desc: Health check and loaded models
    cmds:
      - bash scripts/status.sh

  logs:
    desc: Tail server logs
    cmds:
      - bash scripts/logs.sh {{.CLI_ARGS}}

  backup:
    desc: Backup the models volume to a tar.gz
    cmds:
      - bash scripts/backup.sh

  restore:
    desc: Restore models volume from a backup
    cmds:
      - bash scripts/restore.sh {{.CLI_ARGS}}

  record:
    desc: Start/stop background session recorder
    cmds:
      - bash scripts/record.sh {{.CLI_ARGS}}

  watch:
    desc: Live TUI dashboard (container stats, models, session telemetry)
    cmds:
      - bash scripts/watch.sh

  sessions:
    desc: Session history with peak analysis and model aggregates
    cmds:
      - bash scripts/sessions.sh {{.CLI_ARGS}}

  detect:
    desc: Detect host hardware and show recommended configuration
    cmds:
      - bash scripts/detect.sh --print

  monitor:
    desc: Launch Rust TUI monitor (builds on first run)
    cmds:
      - bash scripts/compose.sh --profile monitor up -d --build
      - docker attach ollama_monitor
