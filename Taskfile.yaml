version: "3"

dotenv: [".env"]
silent: true

tasks:
  boot:
    desc: Start ollama_server and pull a model
    cmds:
      - bash scripts/init.sh {{.CLI_ARGS}}

  reboot:
    desc: Tear down and boot fresh
    cmds:
      - task down
      - task boot

  up:
    desc: Start all services (ollama_server + optional webui)
    cmds:
      - bash scripts/compose.sh up -d

  webui:
    desc: Start ollama_server with Open WebUI
    cmds:
      - bash scripts/compose.sh --profile webui up -d

  down:
    desc: Tear down everything (removes volumes)
    cmds:
      - bash scripts/compose.sh --profile webui down -v --remove-orphans

  stop:
    desc: Stop all services (keeps volumes)
    cmds:
      - bash scripts/compose.sh --profile webui stop

  reload:
    desc: Tear down and restart all services
    cmds:
      - task down
      - sleep 5
      - bash scripts/compose.sh --profile webui up -d

  pull:
    desc: Pull a model into the running container
    cmds:
      - bash scripts/pull.sh {{.CLI_ARGS}}

  list:
    desc: List all pulled models
    cmds:
      - bash scripts/list.sh

  rm:
    desc: Remove a model
    cmds:
      - bash scripts/rm.sh {{.CLI_ARGS}}

  run:
    desc: Start interactive chat with a model
    cmds:
      - bash scripts/run.sh {{.CLI_ARGS}}

  show:
    desc: Show model details
    cmds:
      - bash scripts/show.sh {{.CLI_ARGS}}

  status:
    desc: Health check and loaded models
    cmds:
      - bash scripts/status.sh

  logs:
    desc: Tail server logs
    cmds:
      - bash scripts/logs.sh {{.CLI_ARGS}}

  backup:
    desc: Backup the models volume to a tar.gz
    cmds:
      - bash scripts/backup.sh

  restore:
    desc: Restore models volume from a backup
    cmds:
      - bash scripts/restore.sh {{.CLI_ARGS}}

  record:
    desc: Start/stop background session recorder
    cmds:
      - bash scripts/record.sh {{.CLI_ARGS}}

  watch:
    desc: Live TUI dashboard (container stats, models, session telemetry)
    cmds:
      - bash scripts/watch.sh

  sessions:
    desc: Session history with peak analysis and model aggregates
    cmds:
      - bash scripts/sessions.sh {{.CLI_ARGS}}

  detect:
    desc: Detect host hardware and show recommended configuration
    cmds:
      - bash scripts/detect.sh --print
