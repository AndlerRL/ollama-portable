[package]
name = "ollama-monitor"
version = "0.1.0"
edition = "2021"
description = "TUI monitor for Ollama Docker containers"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
bollard = "0.17"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
