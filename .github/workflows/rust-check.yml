name: Rust Check

on:
  push:
    paths:
      - 'monitor/**'
      - '.github/workflows/rust-check.yml'
  pull_request:
    paths:
      - 'monitor/**'
      - '.github/workflows/rust-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check
        working-directory: monitor
