version: '3.8'

services:
  ollama_server:
    image: ollama/ollama:latest
    container_name: ollama_server
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: always
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  ollama_model_puller:
    image: ollama/ollama:latest
    container_name: ollama_model_puller
    volumes:
      - ollama_storage:/root/.ollama
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo 'Waiting for ollama_server to be ready...';
        for i in $$(seq 1 60); do
          if OLLAMA_HOST=ollama_server:11434 ollama list >/dev/null 2>&1; then
            echo 'Server ready. Pulling model...';
            OLLAMA_HOST=ollama_server:11434 ollama pull $${MODEL:-qwen2.5:1.5b} && exit 0 || exit 1;
          fi;
          echo "Attempt $$i/60 - server not ready, retrying in 3s...";
          sleep 3;
        done;
        echo 'ERROR: ollama_server did not become ready after 180s';
        exit 1;
    depends_on:
      - ollama_server
    restart: "no"

  open_webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open_webui
    ports:
      - "${WEBUI_HOST_PORT:-3000}:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama_server:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
    depends_on:
      ollama_server:
        condition: service_healthy
    restart: always
    profiles:
      - webui

volumes:
  ollama_storage:
    name: ollama_storage
  open_webui_data:
    name: open_webui_data
