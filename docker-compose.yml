services:
  ollama_server:
    image: ollama/ollama:latest
    container_name: ollama_server
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: always
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  open_webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open_webui
    ports:
      - "${WEBUI_HOST_PORT:-3000}:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama_server:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
    depends_on:
      - ollama_server
    restart: always
    profiles:
      - webui

volumes:
  ollama_storage:
    name: ollama_storage
  open_webui_data:
    name: open_webui_data
