version: '3.8'

services:
  ollama_server:
    image: ollama/ollama:latest
    container_name: ollama_server
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: always
    environment:
      - OLLAMA_HOST=0.0.0.0

  ollama_model_puller:
    image: ollama/ollama:latest
    container_name: ollama_model_puller
    volumes:
      - ollama_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=ollama_server:11434
    entrypoint: /bin/sh
    command: -c "
      echo 'Waiting for ollama_server to be ready...';
      for i in \$(seq 1 30); do
        if curl -s http://ollama_server:11434/api/tags >/dev/null 2>&1; then
          echo 'Server ready. Pulling model...';
          ollama pull \${MODEL:-qwen2.5:1.5b};
          exit 0;
        fi;
        echo \"Attempt \$i/30 — server not ready, retrying in 2s...\";
        sleep 2;
      done;
      echo 'ERROR: ollama_server did not become ready after 60s';
      exit 1;
    "
    depends_on:
      - ollama_server
    restart: "no"

  open_webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open_webui
    ports:
      - "${WEBUI_HOST_PORT:-3000}:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama_server:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
    depends_on:
      - ollama_server
    restart: always
    profiles:
      - webui

volumes:
  ollama_storage:
    name: ollama_storage
  open_webui_data:
    name: open_webui_data
